<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Chat</title>

<style>
body{
    font-family:tahoma;
    background:#111827;
    color:white;
    margin:0;
}

#chat{
    height:80vh;
    overflow:auto;
    padding:15px;
}

.msg{
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

.user{
    background:#2563eb;
}

.ai{
    background:#374151;
}

.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    background:#1f2937;
    padding:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    margin-right:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
}
</style>

</head>

<body>

<div id="chat"></div>

<div class="bottom">
<button onclick="send()">ارسال</button>
<input id="text" placeholder="پیام خود را بنویسید...">
</div>

<script>

const API_KEY="AQ.Ab8RN6JdeE13Jr0PNEsW1U0rDX_PhiytHvuLMAPct3Hi6idHTg";

async function send(){

let input=document.getElementById("text");
let message=input.value.trim();

if(message=="") return;

let chat=document.getElementById("chat");

chat.innerHTML+=`<div class="msg user">${message}</div>`;

input.value="";

try{

const response=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:message
}
]
}
]
})
});

const data=await response.json();

console.log(data);

if(!response.ok){

chat.innerHTML+=`
<div class="msg ai">
خطا:
<pre>${JSON.stringify(data,null,2)}</pre>
</div>
`;

return;

}

const answer=data.candidates[0].content.parts[0].text;

chat.innerHTML+=`
<div class="msg ai">${answer}</div>
`;

chat.scrollTop=chat.scrollHeight;

}catch(e){

console.error(e);

chat.innerHTML+=`
<div class="msg ai">
${e.message}
</div>
`;

}

}

</script>

</body>
</html>
